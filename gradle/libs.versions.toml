[versions]
agp = "9.4.1"
coreKtx = "1.19.1"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
lifecycleRuntimeKtx = "2.11.0"
activityCompose = "1.13.0"
kotlin = "2.2.10"
composeBom = "2026.02.01"
composeMaterial = "1.11.2"

ksp = "2.3.7"

daggerHilt = "2.60.1"
daggerHiltTesting = "2.60.1"
daggerHiltComposeNavigation = "1.4.0"
hiltWork = "1.4.0"

navigation = "2.9.8"

retrofit = "3.0.0"
okhttp= "5.4.0"

# Work Manager
workManager = "2.11.2"

# Data / Storage
roomDatabase = "2.8.4"


[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }

# Hilt / DI
dagger-hilt = { module = "com.google.dagger:hilt-android", version.ref = "daggerHilt" }
dagger-ksp = { module = "com.google.dagger:hilt-android-compiler", version.ref = "daggerHilt" }
dagger-hilt-testing = { module = "com.google.dagger:hilt-android-testing", version.ref = "daggerHiltTesting" }
hilt-compose-navigation = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "daggerHiltComposeNavigation" }

# Work Manager
work-manager = { module = "androidx.work:work-runtime-ktx", version.ref = "workManager" }
work-manager-dagger = { module = "androidx.hilt:hilt-work", version.ref = "hiltWork" }
work-manager-dagger-ksp = { module = "androidx.hilt:hilt-compiler", version.ref = "hiltWork" }

# Navigation
navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigation" }
navigation-components-ui = { module = "androidx.navigation:navigation-ui-ktx", version.ref = "navigation" }

# Networking
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofit-gson-convertor = { module = "com.squareup.retrofit2:converter-gson", version.ref = "retrofit" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-logging-interceptors = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }


# Room / Paging / DataStore
room = { module = "androidx.room:room-runtime", version.ref = "roomDatabase" }
room-ktx = { module = "androidx.room:room-ktx", version.ref = "roomDatabase" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "roomDatabase" }

#Compose Material
compose-material = { module = "androidx.compose.material:material", version.ref = "composeMaterial" }



[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }

dagger = { id = "com.google.dagger.hilt.android", version.ref = "daggerHilt" }

kotlinx-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }

ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version = "2.2.20" }